# Permission Engine (Banyanos) — module manifest fragment
# Included by routes.yaml via `!include module_routes/perm_engine.yaml`

name: perm_engine
package: perm_engine
transport: graphql
config_class: "perm_engine.handlers.config:Config"
config_init_style: kwargs
routes:
  - path: "/{endpoint_id}/perm_engine_graphql"
    handler_type: graphql
    dispatch: "perm_engine.main:dispatch_graphql"
    methods: ["POST"]
    auth: true