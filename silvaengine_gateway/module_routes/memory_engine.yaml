# Memory Engine (Banyanos) — module manifest fragment
# Included by routes.yaml via `!include module_routes/memory_engine.yaml`

name: memory_engine
package: memory_engine
transport: graphql
auth_bridge: banyan  # always goes through real PermAuthorizer, any tenant
config_class: "memory_engine.handlers.config:Config"
config_init_style: kwargs
# memory_engine reads a nested settings["neo4j"]; assemble it from the
# gateway's shared flat neo4j_* keys (a directly supplied one wins).
config_overrides:
  neo4j:
    uri: "{setting:neo4j_uri}"
    user: "{setting:neo4j_username}"
    password: "{setting:neo4j_password}"
routes:
  - path: "/{endpoint_id}/memory_engine_graphql"
    handler_type: graphql
    dispatch: "memory_engine.main:dispatch_graphql"
    methods: ["POST"]
    auth: false