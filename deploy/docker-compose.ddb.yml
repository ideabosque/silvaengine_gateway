# =============================================================================
# SilvaEngine Gateway — DDB Local Overlay（deploy.sh 一键部署配套）
#
# 叠加顺序：docker-compose.yml (base) + docker-compose.bindmount.yml + 本文件
# （见 deploy/deploy.sh，其 compose 命令固定携带三个 -f）。只新增两个服务，
# 不与 base/bindmount 的任何键重叠——base 文件末尾的 ddb-local 注释块保持
# 原样，无需取消注释：
#
#   ddb-local — DynamoDB Local（-inMemory -sharedDb）。宿主机 8001 仅绑定
#               127.0.0.1（本地调试/手动灌表用，公网不可见）。
#   ddb-init  — 一次性初始化服务（python:3.12-slim，与网关 Overlay 同镜像，
#               零额外拉取）：等端点就绪 → 幂等建表 → 灌种子（覆盖写）→
#               行数核验。由 deploy.sh 经 `docker compose run --rm ddb-init`
#               驱动；deploy.sh 的 up 显式列出服务清单，不含本服务。
#
# 幂等性：每次部署重跑 ddb-init 即自动重灌种子，覆盖 ddb-local -inMemory
# 重建后的数据丢失（自愈）。表结构/行格式与 scripts/seed_seconfig.py 及
# Lambda 链 ConfigModel 完全一致。
#
# 注：x-logging 锚点为单文件作用域（compose 不跨文件合并锚点），本文件
# 日志轮转参数与 base 保持一致（json-file 10MB × 3）。
# =============================================================================

services:
  ddb-local:
    image: amazon/dynamodb-local:latest
    container_name: silvaengine-gateway-ddb-local
    ports:
      - "127.0.0.1:8001:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ddb-init:
    image: ${DOCKER_MIRROR_PREFIX:-docker.1ms.run/library/}python:3.12-slim
    environment:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./scripts:/ddb:ro
      - ./env:/ddbenv:ro
      - gateway-ddbinit-pip-cache:/root/.cache/pip
    depends_on:
      - ddb-local
    restart: "no"
    command:
      - bash
      - -c
      - |
        pip install -q boto3 && python /ddb/ddb_init.py \
          --file /ddbenv/se-configdata.local.json \
          --endpoint-url http://ddb-local:8000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gateway-ddbinit-pip-cache:
    name: silvaengine-gateway_ddbinit-pip-cache